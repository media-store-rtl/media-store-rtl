name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to cPanel
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://web2022.ir

    steps:
      - name: Deploy on cPanel server
        env:
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          CPANEL_KNOWN_HOSTS: ${{ secrets.CPANEL_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          test -n "$CPANEL_SSH_KEY"
          test -n "$CPANEL_KNOWN_HOSTS"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$CPANEL_SSH_KEY" > "$HOME/.ssh/cpanel_deploy"
          chmod 600 "$HOME/.ssh/cpanel_deploy"

          printf '%s\n' "$CPANEL_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          ssh -i "$HOME/.ssh/cpanel_deploy"             -o IdentitiesOnly=yes             -o BatchMode=yes             mediast1@artin.pws-dns.net             'set -e
             cd /home/mediast1/repositories/media-store-rtl
             git fetch origin main
             git reset --hard origin/main
             composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
             npm ci
             npm run build
             php artisan optimize'
