name: SEO branch checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/profile-seo-metadata]

permissions:
  contents: read

jobs:
  validate:
    name: Build, format, and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npx eslint .
