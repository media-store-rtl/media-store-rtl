---
deployment:
  tasks:
    - /bin/bash -lc 'cd /home/mediast1/repositories/media-store-rtl && rm -f bootstrap/cache/*.php'
    - /bin/bash -lc 'cd /home/mediast1/repositories/media-store-rtl && composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction'
    - /bin/bash -lc 'cd /home/mediast1/repositories/media-store-rtl && npm ci'
    - /bin/bash -lc 'cd /home/mediast1/repositories/media-store-rtl && rm -rf public/build && rm -rf bootstrap/ssr && npm run build:ssr'
    - /bin/bash -lc 'cd /home/mediast1/repositories/media-store-rtl && /usr/bin/rsync -a --exclude ".git/" --exclude "node_modules/" --exclude "public/" --exclude "storage/" --exclude ".env" ./ /home/mediast1/'
    - /bin/bash -lc 'cd /home/mediast1/repositories/media-store-rtl && /usr/bin/rsync -a public/ /home/mediast1/public_html/'
    - /bin/bash -lc 'php /home/mediast1/artisan optimize:clear && php /home/mediast1/artisan optimize'
